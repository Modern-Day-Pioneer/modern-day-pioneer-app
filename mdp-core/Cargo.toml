[package]
name = "mdp-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
fs4 = { version = "0.13", features = ["sync"] }
id3 = "1"
imagesize = "0.15.0"
jpeg-encoder = "0.7.1"
kamadak-exif = "0.6.1"
metaflac = "0.2"
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }
rand = "0.8"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
